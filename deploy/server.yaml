# Central server config, as mounted by docker-compose.yml.
# Any key can be overridden by FLAMINGO_<SECTION>_<KEY>, e.g. FLAMINGO_DATABASE_URL.
# ${VAR} references are expanded from the environment, so secrets stay in .env.

listen: ":8420"
public_url: "http://localhost:8420"

database:
  url: "postgres://flamingo:${FLAMINGO_DB_PASSWORD}@db:5432/flamingo?sslmode=disable"
  migrate_on_start: true

storage:
  thumbs_dir: /data/thumbs

auth:
  session_ttl: 720h
  secret_key_file: /run/secrets/flamingo_key   # seals Toggl tokens
  signup: invite                         # invite | closed

ytdlp:
  path: yt-dlp
  extra_args: []
  stream_max_height: 1080   # the quality a stream starts at
