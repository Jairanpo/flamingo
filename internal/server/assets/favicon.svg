<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Flamingo: a pink silhouette on one leg, on the app's night pine green. -->
  <rect width="64" height="64" rx="14" fill="#16231c"/>
  <!-- neck: an S rising from the breast to the head -->
  <path d="M27 33 C 19 27, 18 19, 23 14 C 27 10, 34 11, 33 17"
        fill="none" stroke="#EB9FEF" stroke-width="5" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="30.5" cy="13" r="4.6" fill="#EB9FEF"/>
  <!-- beak: bends down, dark tip -->
  <path d="M33.5 10.5 L 41 13.5 L 37.5 20 Z" fill="#FECEE9"/>
  <path d="M39 15 L 41 13.5 L 37.5 20 Z" fill="#101a15"/>
  <circle cx="31" cy="12" r="1.1" fill="#101a15"/>
  <!-- body with a tail that tips up -->
  <path d="M24 33 C 24 26, 32 23, 40 25 C 45 26, 50 24, 54 21
           C 53 28, 48 35, 40 37 C 32 39, 24 38, 24 33 Z" fill="#EB9FEF"/>
  <!-- wing line -->
  <path d="M30 31 C 36 28, 43 28, 49 25" fill="none" stroke="#101a15"
        stroke-opacity=".35" stroke-width="1.6" stroke-linecap="round"/>
  <!-- standing leg and the folded one -->
  <path d="M36 37 L 36 57 M 32 57 L 40 57" stroke="#EB9FEF" stroke-width="3"
        stroke-linecap="round" fill="none"/>
  <path d="M36 44 L 43 47 L 36 50" stroke="#EB9FEF" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
