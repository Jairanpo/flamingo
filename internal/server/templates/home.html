<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flamingo</title>
<link rel="stylesheet" href="/assets/auth.css">
</head>
<body>
<main class="card">
  <p class="brand">Flamingo</p>
  <p class="sub">Signed in as <strong>{{.DisplayName}}</strong> ({{.Name}}{{if .IsAdmin}}, admin{{end}}).</p>
  <p>Your library moves here in phase 5. Until then it stays at the usual address.</p>
  <form method="post" action="/logout">
    <button type="submit" class="quiet">Sign out</button>
  </form>
</main>
</body>
</html>
